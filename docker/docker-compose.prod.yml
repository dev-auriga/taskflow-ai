services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - taskflow_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      API_PORT: '3001'
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: taskflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taskflow-net

volumes:
  taskflow_pgdata_prod:
    driver: local

networks:
  taskflow-net:
    driver: bridge
